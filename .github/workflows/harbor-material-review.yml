name: Harbor material-aware occlusion review

on:
  pull_request:
    paths:
      - "scripts/art/reconstruct-harbor-material-review.py"
      - "scripts/art/harbor-deck-texture-guard.py"
      - "scripts/art/reconstruct-harbor-authored-review.py"
      - "scripts/art/harbor-authored-review-smoke.py"
      - ".github/workflows/harbor-material-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  material-art-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned review dependencies
        run: python -m pip install "numpy==1.26.4" "opencv-python-headless==4.10.0.84"
      - name: Generate water AND dock test candidate
        run: python scripts/art/reconstruct-harbor-material-review.py --out artifacts/art-review/harbor-material
      - name: Assert review-only contract and source preservation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/art-review/harbor-material")
          d=json.loads((root/"material-review.json").read_text())
          assert d["source_outside_opening_pixel_exact"] is True
          assert d["donor_invalid_pixels"] == 0
          assert 15000 <= d["opened_pixels"] <= 18000
          assert d["pier_filled_pixels"] > 4000 and d["water_filled_pixels"] > 4000
          assert d["pier_filled_pixels"]+d["water_filled_pixels"]==d["opened_pixels"]
          assert d["player_offsets_review_px"] == [-18,0,18]
          assert d["production_promoted"] is False
          assert d["real_game_motion_integrated"] is False
          assert d["true_hidden_dock_art_approved"] is False
          assert d["actor_rod_line_connection_verified"] is False
          assert d["human_art_review"] == "pending"
          offsets=d["quay_edge_variants"]
          assert [v["quay_edge_offset_px"] for v in offsets] == [-6,0,6]
          assert all(v["outside_opening_pixel_exact"] and not v["approved"] for v in offsets)
          assert d["variant_art_review_complete"] is False
          edge=d["visible_edge_review"]
          assert edge["hand_estimated"] and not edge["art_approved"]
          assert edge["outside_opening_pixel_exact"] and not edge["production_promoted"]
          assert len(edge["anchors"]) == 6
          assert 0.38 < edge["slope"] < 0.54
          assert edge["maximum_anchor_residual_px"] < 12
          assert edge["anchored_pier_pixels"] != edge["legacy_pier_pixels"]
          assert not edge["anchored_structure_reuse"]["safe_for_production"]
          topology=d["quay_topology_h02"]
          assert topology["partition_verified"] is True
          assert topology["water_target_pixels"] > 4000
          assert topology["deck_target_pixels"] > 5000
          assert topology["front_face_target_pixels"] > 500
          assert topology["water_target_pixels"] + topology["deck_target_pixels"] + topology["front_face_target_pixels"] == d["opened_pixels"]
          assert topology["approved"] is False
          assert topology["hidden_structure_authored"] is False
          assert topology["motion_ready"] is False
          reuse=d["donor_structure_reuse"]
          assert reuse["measurement_only"] and reuse["hand_estimated_roi"]
          assert reuse["safe_for_production"] is False
          assert reuse["bollard_target_pixels"] > 0
          assert reuse["rope_target_pixels"] > 0
          assert reuse["bollard_target_pixels"] <= reuse["pier_target_pixels"]
          assert reuse["rope_target_pixels"] <= reuse["pier_target_pixels"]
          assert all(v["donor_structure_reuse"]["safe_for_production"] is False for v in offsets)
          assert all(v["quay_topology_h02"]["approved"] is False for v in offsets)
          diag=d["material_seam_diagnostic"]
          assert diag["measurement_only"] and not diag["human_approval_inferred"]
          assert diag["seam_band_pixels"] > 0 and diag["opening_rim_pixels"] > 0
          assert 0 <= diag["seam_horizontal_abs_rgb_mean"] <= 255
          for name in ("visible-edge-world-review.png", "visible-edge-motion-board.jpg", "quay-visible-edge-overlay.png",
                       "world-material-candidate.png", "material-mask.png", "seam-boundary-review.png", "donor-structure-risk-map.png", "quay-topology-h02-review.png", "material-motion-board.jpg",
                       "quay-edge-variants-board.jpg", "quay-edge--6-player-center.png",
                       "quay-edge-+0-player-center.png", "quay-edge-+6-player-center.png",
                       "player-offset--18.png", "player-offset-+0.png", "player-offset-+18.png"):
              assert (root/name).stat().st_size > 500, name
          print("Material-separated world preview created; not production/animation approval")
          PY
      - name: Screen stretched/flat pier donor texture (not an art approval)
        run: |
          python scripts/art/harbor-deck-texture-guard.py --self-test \
            --candidate artifacts/art-review/harbor-material/world-material-candidate.png \
            --material-mask artifacts/art-review/harbor-material/material-mask.png \
            --report artifacts/art-review/harbor-material/deck-texture-guard.json

      - name: Test geometry-authored quay reconstruction (H02 QA only)
        run: |
          python scripts/art/harbor-authored-review-smoke.py
          python scripts/art/reconstruct-harbor-authored-review.py \
            --out artifacts/art-review/harbor-material/authored-h02
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/art-review/harbor-material/authored-h02')
          report=json.loads((root/'h02-authored-review.json').read_text())
          assert report['source_dimensions']==[391,783]
          assert 15000 <= report['opened_pixels'] <= 18000
          assert sum(report[key] for key in ('water_pixels','deck_pixels','front_face_pixels'))==report['opened_pixels']
          assert report['outside_opening_pixel_exact'] and report['cutout_filled_opaque']
          assert report['materials']['bollard_or_rope_pixels_donor_copied']==0
          assert report['materials']['water_donor_max_y'] < 478
          assert not report['art_approved'] and not report['production_promoted']
          assert not report['existing_actor_cutout_is_clean']
          assert not report['full_wide_ocean_world_ready']
          assert not report['game_motion_implemented']
          for name in ('h02-authored-world-candidate.png','h02-authored-material-mask.png',
                       'h02-authored-edge-diagnostic.png','h02-authored-motion-board.jpg',
                       'h02-authored-player--18.png','h02-authored-player-+0.png','h02-authored-player-+18.png'):
            assert (root/name).stat().st_size>500,name
          print('H02 output contract OK. Visual approval remains pending.')
          PY
          python scripts/art/harbor-deck-texture-guard.py \
            --candidate artifacts/art-review/harbor-material/authored-h02/h02-authored-world-candidate.png \
            --material-mask artifacts/art-review/harbor-material/authored-h02/h02-authored-material-mask.png \
            --report artifacts/art-review/harbor-material/authored-h02/deck-texture-guard.json

      - name: Upload manual art-review evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harbor-material-aware-review
          path: artifacts/art-review/harbor-material/
          retention-days: 14
          if-no-files-found: error
