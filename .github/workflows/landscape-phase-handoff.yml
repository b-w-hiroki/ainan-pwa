name: Native landscape phase handoff diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/capture-landscape-phase-handoff.mjs'
      - '.github/workflows/landscape-phase-handoff.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/capture-landscape-phase-handoff.mjs'
      - '.github/workflows/landscape-phase-handoff.yml'
permissions:
  contents: read
jobs:
  handoff:
    # Playwright 1.55 cannot install Chromium dependencies on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Start isolated built preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/preview.log" 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/fishing-game/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/preview.log"
          exit 1
      - name: Verify same 844x390 real pointer and phase ownership
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-landscape-phase-handoff.mjs
      - name: Preserve camera/HIT/battle screenshots and QA metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landscape-phase-handoff-evidence
          path: artifacts/orientation/landscape-phases/
          if-no-files-found: warn
          retention-days: 14
