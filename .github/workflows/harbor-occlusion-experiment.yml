name: Harbor Occlusion Candidate (review only)
on:
  push:
    branches:
      - "experiment/harbor-occlusion-*"
    paths:
      - "scripts/art/experiment-occlusion-repair.py"
      - "scripts/art/segment-approved-player.py"
      - ".github/workflows/harbor-occlusion-experiment.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-processing dependencies in isolated CI
        run: python -m pip install "numpy==1.26.4" "opencv-python-headless==4.10.0.84"
      - name: Extract source-faithful masks from the approved Harbor illustration
        run: node scripts/art/extract-harbor-approved-master.mjs
      - name: Preserve exact existing player cutout for silhouette inspection
        run: |
          mkdir -p artifacts/occlusion/source
          cp fishing-game/assets/approved-mock/cast-player-visible.png artifacts/occlusion/source/player-existing-cutout.png
          cp fishing-game/assets/generated/harbor-aji-master-v2/cast-harbor-player-region-extracted.png artifacts/occlusion/source/player-coarse-region.png
      - name: Produce two background-fill candidates without changing production
        run: |
          python scripts/art/experiment-occlusion-repair.py --out artifacts/occlusion/mask-3px --dilation 3
          python scripts/art/experiment-occlusion-repair.py --out artifacts/occlusion/mask-8px --dilation 8
      - name: Cut out the player as a review-only source-faithful silhouette
        run: python scripts/art/segment-approved-player.py --out artifacts/occlusion/player-silhouette
      - name: Assert candidate artifacts remain non-production
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for folder in sorted(Path("artifacts/occlusion").glob("mask-*")):
              doc = json.loads((folder/"experiment-report.json").read_text())
              assert doc["outside_mask_pixel_parity"] is True
              assert doc["production_promoted"] is False
              assert doc["motion_ready"] is False
              assert doc["human_visual_review"] == "not_checked"
              for name in ("approved-source.png","candidate-inpainted-background.png","review-hole-mask.png","review-side-by-side.png"):
                  assert (folder/name).stat().st_size > 10000, name
          cutout = json.loads(Path("artifacts/occlusion/player-silhouette/mask-report.json").read_text())
          assert cutout["original_rgb_preserved"] is True
          assert cutout["foreground_pixels_gt127"] > 9000
          assert cutout["production_promoted"] is False
          assert cutout["game_integrated"] is False
          assert (Path("artifacts/occlusion/player-silhouette/player-mask-comparison.png")).stat().st_size > 10000
          print("Mask and inpainting prototypes remain review-only; source pixels unchanged")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-harbor-occlusion-candidate
          path: artifacts/occlusion/
          retention-days: 14
          if-no-files-found: error
