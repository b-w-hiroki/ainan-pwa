name: Harbor Occlusion Candidate (review only)
on:
  push:
    branches:
      - "experiment/harbor-occlusion-*"
    paths:
      - "scripts/art/experiment-occlusion-repair.py"
      - ".github/workflows/harbor-occlusion-experiment.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-processing dependencies in isolated CI
        run: python -m pip install "numpy==1.26.4" "opencv-python-headless==4.10.0.84"
      - name: Extract source-faithful masks from the approved Harbor illustration
        run: node scripts/art/extract-harbor-approved-master.mjs
      - name: Produce two background-fill candidates without changing production
        run: |
          python scripts/art/experiment-occlusion-repair.py --out artifacts/occlusion/mask-3px --dilation 3
          python scripts/art/experiment-occlusion-repair.py --out artifacts/occlusion/mask-8px --dilation 8
      - name: Assert candidate artifacts remain non-production
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for folder in sorted(Path("artifacts/occlusion").iterdir()):
              doc = json.loads((folder/"experiment-report.json").read_text())
              assert doc["outside_mask_pixel_parity"] is True
              assert doc["production_promoted"] is False
              assert doc["motion_ready"] is False
              assert doc["human_visual_review"] == "not_checked"
              for name in ("approved-source.png","candidate-inpainted-background.png","review-hole-mask.png","review-side-by-side.png"):
                  assert (folder/name).stat().st_size > 10000, name
          print("Inpainting prototype artifact and conservative state contract: passed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-harbor-occlusion-candidate
          path: artifacts/occlusion/
          retention-days: 14
          if-no-files-found: error
