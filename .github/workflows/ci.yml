name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check documentation sync
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-documentation-sync.mjs

      - name: Test documentation gate
        run: node --test scripts/check-documentation-sync.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical

      - name: QA and production build
        run: npm run build

  mobile-e2e:
    needs: build
    runs-on: ubuntu-latest
    # Full captures plus artifact upload reached 15m on run 39031399419.
    # Keep every assertion and allow cleanup to finish on slower runners.
    # Density coverage adds four phases, eight scenes, context restoration and
    # five 2x-density drags to the existing ~17m run. Retain every assertion.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ainan-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/fishing-game/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ainan-preview.log
          exit 1

      - name: Validate built PWA endpoints
        run: |
          curl -fsS http://127.0.0.1:4173/manifest.webmanifest > /tmp/ainan-manifest.webmanifest
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('/tmp/ainan-manifest.webmanifest','utf8')); if(m.display!=='standalone') process.exit(1); if(!m.icons?.some(i=>i.src?.includes('ainan-icon.svg'))) process.exit(2); console.log('manifest OK')"
          curl -fsS http://127.0.0.1:4173/ainan-icon.svg > /tmp/ainan-icon.svg
          grep -q "<svg" /tmp/ainan-icon.svg
          curl -fsS http://127.0.0.1:4173/sw.js > /tmp/ainan-sw.js
          grep -q "precache" /tmp/ainan-sw.js
          echo "PWA endpoints OK"

      - name: Verify QA arrival survives slow Title and Town loading
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-qa-route-loading-race.mjs

      - name: Verify portrait player-anchored fan and real drag
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-player-origin-fan.mjs

      - name: Verify dense rendering, masks, real tap, context restore and rotation
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-dense-rendering.mjs

      - name: Verify 2x density real cast drag in five viewports
        run: QA_DPR=2 npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-player-origin-fan.mjs

      - name: Verify core artwork survives ordinary PWA offline reload
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-pwa-offline-art.mjs

      - name: Verify native 844x390 cone cast, world pointer and landing
        run: QA_VIEWPORT=844x390 QA_ROD=carbon QA_EDGE=center npm exec --yes --package=playwright@1.55.0 -- node scripts/cone-world-geometry-browser-qa.mjs

      - name: Verify 932x430 wide-world camera and actual Cast landing
        run: QA_VIEWPORT=932x430 QA_ROD=carbon QA_EDGE=center npm exec --yes --package=playwright@1.55.0 -- node scripts/cone-world-geometry-browser-qa.mjs

      - name: Validate actual 844x390 mouse swipe and single cast reward
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-native-landscape-real-swipe.mjs

      - name: Verify fast Battle-to-Result removes old BIG HIT cut-in
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-fast-result-cutins.mjs

      - name: Verify landscape Cast, real HIT tap, Battle and Result ownership
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-landscape-phase-handoff.mjs

      - name: Verify native landscape Result layout and real Town CTA
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-landscape-result-reflow.mjs

      - name: Verify Cast after live portrait-landscape rotation
        run: QA_ROTATE_BEFORE_CAST=1 npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-native-landscape-real-swipe.mjs

      - name: Verify QA-only native Home horizontal presentation
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-native-home-landscape.mjs

      - name: Verify QA-only native Town horizontal presentation
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-native-town-landscape.mjs

      - name: Verify QA-only native Collection horizontal presentation
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-native-collection-landscape.mjs

      - name: Verify QA-only native Menu horizontal presentation
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-native-menu-landscape.mjs

      - name: Verify QA-only native Settings horizontal presentation
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-native-settings-landscape.mjs

      - name: Verify continuous QA-only horizontal scene journey
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-native-landscape-journey.mjs

      - name: Verify QA native scene reflow after live device rotation
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-native-qa-rotation.mjs

      - name: Capture iPhone QA flows
        run: |
          mkdir -p artifacts/e2e
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=MapScene" artifacts/e2e/42-clearance-map.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=TownScene&townTier=5" artifacts/e2e/43-clearance-town.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3000 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=GameScene&qaAction=battle&qaPlayer=battle" artifacts/e2e/44-clearance-fishing.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=HomeScene" artifacts/e2e/00-home-character-clearance.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=HomeScene" artifacts/e2e/01-home.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=MapScene" artifacts/e2e/02-map.png
          npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-battle-state.mjs
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=4200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=TownScene&townTier=1" artifacts/e2e/05-town-lv1.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3600 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=TownScene&townTier=3" artifacts/e2e/06-town-lv3.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=4000 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=TownScene&townTier=5" artifacts/e2e/07-town-lv5.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=ProfileScene" artifacts/e2e/08-profile.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=DailyScene" artifacts/e2e/09-daily.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=AchievementScene" artifacts/e2e/10-achievements.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=CollectionScene" artifacts/e2e/11-collection.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=WorkshopScene" artifacts/e2e/12-workshop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=HarborServicesScene" artifacts/e2e/13-services.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=SettingsScene" artifacts/e2e/14-settings.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=GameScene&qaAction=battle&qaLocation=pointA&qaFish=aji" artifacts/e2e/15-field-harbor.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=GameScene&qaAction=battle&qaLocation=pointB&qaFish=aji" artifacts/e2e/16-field-bay.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=GameScene&qaAction=battle&qaLocation=pointC&qaFish=saba" artifacts/e2e/17-field-cape.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=ChallengeScene" artifacts/e2e/18-challenge.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=4200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=GameScene&qaAction=battle&qaBoss=harborRunner" artifacts/e2e/19-boss-harbor.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=4200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=GameScene&qaAction=battle&qaBoss=bayHunter" artifacts/e2e/20-boss-bay.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=4200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=GameScene&qaAction=battle&qaBoss=kue" artifacts/e2e/21-boss-kue.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=MapScene&bossState=pending" artifacts/e2e/23-map-boss-pending.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=2800 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=GameScene&qaAction=battle&qaBoss=harborRunner&qaEncounter=1" artifacts/e2e/24-encounter-harbor.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=2800 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=GameScene&qaAction=battle&qaBoss=bayHunter&qaEncounter=1" artifacts/e2e/25-encounter-bay.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=2800 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=GameScene&qaAction=battle&qaBoss=kue&qaEncounter=1" artifacts/e2e/26-encounter-kue.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=RarityQaScene&qaRarity=common" artifacts/e2e/28-rarity-common.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=RarityQaScene&qaRarity=uncommon" artifacts/e2e/29-rarity-uncommon.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=RarityQaScene&qaRarity=rare" artifacts/e2e/30-rarity-rare.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=RarityQaScene&qaRarity=legendary" artifacts/e2e/31-rarity-legendary.png
          # Reuse the existing Result state and decoded-pixel guard rather than
          # accepting one delayed CLI screenshot that may be blank in WebGL.
          npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-reward-results.mjs
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3000 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=GameScene&qaPlayer=hit" artifacts/e2e/36-player-hit.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3000 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=GameScene&qaAction=battle&qaPlayer=battle" artifacts/e2e/37-player-battle.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3600 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=GameScene&qaAction=battle&qaBoss=kue&qaPlayer=boss" artifacts/e2e/38-player-boss.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=AchievementScene&qaRewardBanner=achievement" artifacts/e2e/40-achievement-reward-banner.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=MenuScene" artifacts/e2e/41-menu-ui-final.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=GameScene&qaMockPhase=cast" artifacts/e2e/46-mock-cast.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=GameScene&qaMockPhase=retrieve" artifacts/e2e/47-mock-retrieve.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3200 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=GameScene&qaMockPhase=battle" artifacts/e2e/48-mock-battle.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=3000 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=GameScene&qaMockPhase=result" artifacts/e2e/49-mock-result.png

      - name: Verify Fishing loads damaged saves without overwriting recovery data
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-corrupt-save-recovery.mjs

      - name: Verify workshop recipes and deliberate upgrade purchases
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-workshop-recipes.mjs

      - name: Verify held retrieve cancels on input interruption
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-retrieve-release.mjs

      - name: Verify deliberate Home button taps after input interruption
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-home-deliberate-tap.mjs

      - name: Verify interrupted footer and keyboard navigation
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-ui-interruption-audit.mjs

      - name: Verify Settings backup failures, clipboard fallback and 44px touch targets
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-settings-storage-actions.mjs

      - name: Capture named Result fish with rendered state assertions
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-named-results.mjs

      - name: Verify approved-art split against baseline Cast
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-approved-master-split.mjs

      - name: Verify foreground separation and landscape baseline
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-foreground-orientation.mjs

      - name: Verify approved art pixel parity and negative control
        run: node scripts/approved-master-pixel-parity.mjs artifacts/e2e

      - name: Capture species-specific Town arrival screens
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-town-catch-reactions.mjs

      - name: Capture species-specific Jump rage poses
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-species-jumps.mjs

      - name: Verify QA-only character and rod attachment at three motion offsets
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-character-grip-offsets.mjs

      - name: Review Harbor Bay Cape Cast and Retrieve art preview
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-cast-retrieve-location-preview.mjs

      - name: Capture cute girl with independent ponytail
        run: |
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=5000 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=GameScene&qaHarborPlayable=1&cameraPan=1&coneLoop=1&qaBody=cute-b-01" artifacts/e2e/90-cute-girl-portrait.png
          node -e 'require("fs").writeFileSync("/tmp/appearance-storage.json",JSON.stringify({cookies:[],origins:[{origin:"http://127.0.0.1:4173",localStorage:[{name:"ainan_character_appearance",value:"cute-b-01"}]}]}))'
          npx --yes playwright@1.55.0 screenshot --browser=chromium --load-storage=/tmp/appearance-storage.json --viewport-size="390,844" --wait-for-timeout=5000 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=GameScene&castLayers=1" artifacts/e2e/92-character-appearance.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --load-storage=/tmp/appearance-storage.json --viewport-size="390,844" --wait-for-timeout=5000 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=SettingsScene&castLayers=1" artifacts/e2e/93-character-settings.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="844,390" --wait-for-timeout=5000 "http://127.0.0.1:4173/fishing-game/?qa=1&scene=GameScene&qaHarborPlayable=1&cameraPan=1&coneLoop=1&qaBody=cute-b-01" artifacts/e2e/91-cute-girl-landscape.png

      - name: Validate E2E screenshots
        run: node scripts/visual-screenshot-guard.mjs artifacts/e2e

      - name: Verify actual Result screen pixels
        run: node scripts/result-screen-pixel-guard.mjs artifacts/e2e

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ainan-mobile-e2e
          path: |
            artifacts/e2e
            artifacts/town-compact
            artifacts/orientation
            artifacts/location-preview
            artifacts/qa-route-loading
            artifacts/dense-rendering
          retention-days: 14
