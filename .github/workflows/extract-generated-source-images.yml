name: Archive generated fishing images

on:
  push:
    paths:
      - 'fishing-game/assets/fishing-field/**/*.svg'
      - '.github/workflows/extract-generated-source-images.yml'
      - '.github/requirements-image-archive.lock'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: "python -m pip install --disable-pip-version-check --quiet --only-binary=:all: --require-hashes -r .github/requirements-image-archive.lock"
      - name: Render production parts to PNG archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import cairosvg

          root = Path('fishing-game/assets/fishing-field')
          out = Path('docs/art-spec/generated-source-images/files')
          out.mkdir(parents=True, exist_ok=True)

          mapping = {
              'water/water_base_01.svg': 'water_base_generated.png',
              'water/water_pattern_01.svg': 'water_pattern_generated.png',
              'water/water_highlight_01.svg': 'water_highlight_generated.png',
              'water/underwater_depth_01.svg': 'underwater_depth_generated.png',
              'fish_shadow/fish_shadow_s_idle_01.svg': 'fish_shadow_s_idle_generated.png',
              'fish_shadow/fish_shadow_m_idle_01.svg': 'fish_shadow_m_idle_generated.png',
              'fish_shadow/fish_shadow_m_turn_01.svg': 'fish_shadow_m_turn_generated.png',
              'fish_shadow/fish_shadow_l_idle_01.svg': 'fish_shadow_l_idle_generated.png',
              'field_objects/rock_01.svg': 'rock_generated.png',
              'field_objects/seaweed_01.svg': 'seaweed_generated.png',
              'lure/lure_idle_01.svg': 'lure_idle_generated.png',
              'lure/lure_trail_01.svg': 'lure_trail_generated.png',
              'fx/fx_ripple_small_01.svg': 'fx_ripple_small_generated.png',
              'fx/fx_follow_wave_01.svg': 'fx_follow_wave_generated.png',
              'fx/fx_ripple_bite_01.svg': 'fx_ripple_bite_generated.png',
              'fx/fx_hit_flash_01.svg': 'fx_hit_flash_generated.png',
              'ui/retrieve_button_short_reel_01.svg': 'retrieve_button_short_reel_generated.png',
          }

          rendered = []
          for src_rel, dest_name in mapping.items():
              src = root / src_rel
              if not src.exists():
                  raise FileNotFoundError(src)
              dest = out / dest_name
              cairosvg.svg2png(url=str(src), write_to=str(dest), output_width=512)
              with Image.open(dest) as im:
                  im.thumbnail((512, 512), Image.Resampling.LANCZOS)
                  im.save(dest, optimize=True)
              rendered.append(dest)

          thumbs = []
          for p in rendered:
              with Image.open(p).convert('RGBA') as im:
                  canvas = Image.new('RGBA', (220, 190), (236, 249, 252, 255))
                  thumb = ImageOps.contain(im, (190, 145), Image.Resampling.LANCZOS)
                  canvas.alpha_composite(thumb, ((220-thumb.width)//2, 8 + (145-thumb.height)//2))
                  d = ImageDraw.Draw(canvas)
                  d.text((8, 160), p.stem.replace('_generated',''), fill=(22, 58, 78, 255))
                  thumbs.append(canvas)
          cols = 4
          rows = (len(thumbs) + cols - 1) // cols
          sheet = Image.new('RGBA', (cols*220, rows*190), (215, 243, 248, 255))
          for i, im in enumerate(thumbs):
              sheet.alpha_composite(im, ((i % cols)*220, (i // cols)*190))
          sheet.save(out / 'generated_asset_sheet.png', optimize=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-source-images
          path: docs/art-spec/generated-source-images/files/*.png
          if-no-files-found: error

  archive:
    if: ${{ !startsWith(github.ref, 'refs/heads/security/') }}
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: generated-source-images
          path: ${{ runner.temp }}/generated-source-images
      - name: Validate archive artifact before copying into checkout
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/generated-source-images
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          source = Path(os.environ['ARTIFACT_DIR'])
          target = Path('docs/art-spec/generated-source-images/files')
          names = {
              'water_base_generated.png', 'water_pattern_generated.png',
              'water_highlight_generated.png', 'underwater_depth_generated.png',
              'fish_shadow_s_idle_generated.png', 'fish_shadow_m_idle_generated.png',
              'fish_shadow_m_turn_generated.png', 'fish_shadow_l_idle_generated.png',
              'rock_generated.png', 'seaweed_generated.png',
              'lure_idle_generated.png', 'lure_trail_generated.png',
              'fx_ripple_small_generated.png', 'fx_follow_wave_generated.png',
              'fx_ripple_bite_generated.png', 'fx_hit_flash_generated.png',
              'retrieve_button_short_reel_generated.png', 'generated_asset_sheet.png',
          }
          if source.is_symlink() or not source.is_dir():
              raise SystemExit('Invalid archive artifact directory')
          actual = {p.name for p in source.iterdir()}
          if actual != names:
              raise SystemExit(f'Unexpected archive artifact files: {sorted(actual ^ names)}')
          if target.is_symlink() or any(p.is_symlink() for p in target.parents):
              raise SystemExit('Archive target crosses a symlink')
          if any((target / name).is_symlink() for name in names):
              raise SystemExit('Archive target includes a symlink')
          target.mkdir(parents=True, exist_ok=True)
          for name in sorted(names):
              file = source / name
              if file.is_symlink() or not file.is_file() or file.read_bytes()[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'Invalid PNG artifact: {name}')
              (target / name).write_bytes(file.read_bytes())
          PY
      - name: Commit archived PNG images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/art-spec/generated-source-images/files
          if git diff --cached --quiet; then
            echo 'No image changes to commit'
            exit 0
          fi
          git commit -m 'assets: archive generated fishing images'
          git push origin HEAD:"$GITHUB_REF"

