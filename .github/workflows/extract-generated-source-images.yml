name: Extract generated source images

on:
  push:
    paths:
      - 'docs/art-spec/generated-source-images/source-images.base64.txt'
      - 'docs/art-spec/generated-source-images/source-images.part*.txt'
      - '.github/workflows/extract-generated-source-images.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild source image archive
        shell: bash
        run: |
          set -euo pipefail
          ROOT='docs/art-spec/generated-source-images'
          if compgen -G "$ROOT/source-images.part*.txt" > /dev/null; then
            cat "$ROOT"/source-images.part*.txt > /tmp/source-images.b64
          else
            cp "$ROOT/source-images.base64.txt" /tmp/source-images.b64
          fi
          base64 --decode /tmp/source-images.b64 > /tmp/source-images.zip
          unzip -t /tmp/source-images.zip
      - name: Extract source images
        run: |
          rm -rf docs/art-spec/generated-source-images/files
          mkdir -p docs/art-spec/generated-source-images/files
          unzip -o /tmp/source-images.zip -d docs/art-spec/generated-source-images/files
      - name: Commit extracted images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/art-spec/generated-source-images/files
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'assets: extract generated source images'
          git push
