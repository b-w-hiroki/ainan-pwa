name: Extract generated source images

on:
  push:
    paths:
      - 'docs/art-spec/generated-source-images/source-images.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source images
        run: |
          mkdir -p docs/art-spec/generated-source-images/files
          unzip -o docs/art-spec/generated-source-images/source-images.zip -d docs/art-spec/generated-source-images/files
      - name: Commit extracted images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/art-spec/generated-source-images/files
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'assets: extract generated source images'
          git push
