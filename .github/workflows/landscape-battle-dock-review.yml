name: Native landscape Battle dock review
on:
  pull_request:
    paths:
      - 'fishing-game/js/scenes/components/BattleUI.js'
      - 'scripts/capture-landscape-battle-dock.mjs'
      - '.github/workflows/landscape-battle-dock-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  battle-layout:
    # Playwright 1.55 cannot install Chromium dependencies on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Start built preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/preview.log" 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/fishing-game/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/preview.log"
          exit 1
      - name: Verify native Battle action at portrait and two landscapes
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-landscape-battle-dock.mjs
      - name: Upload screenshots and layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-dock-review
          path: artifacts/orientation/battle-compact/
          retention-days: 14
          if-no-files-found: warn
