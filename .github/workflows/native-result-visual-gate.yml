name: Native Result visual gate

on:
  pull_request:
    paths:
      - 'fishing-game/js/scenes/components/ResultUI.js'
      - 'fishing-game/js/scenes/GameScene.js'
      - 'fishing-game/js/game/installFishingResultPresentation.js'
      - 'fishing-game/js/game/installFishingVisualUpgrade.js'
      - 'fishing-game/js/game/installFishingPresentationGuard.js'
      - 'scripts/capture-landscape-result-reflow.mjs'
      - '.github/workflows/native-result-visual-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-result:
    # Playwright 1.55 cannot install Chromium dependencies on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build full QA and game assets
        run: npm run build
      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ainan-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/fishing-game/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ainan-preview.log
          exit 1
      - name: Exercise actual Result scenes in three viewport sizes
        run: npm exec --yes --package=playwright@1.55.0 -- node scripts/capture-landscape-result-reflow.mjs
      - name: Preserve real PNGs and layout evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-result-layout-review
          path: artifacts/orientation/result-reflow
          if-no-files-found: warn
          retention-days: 14
