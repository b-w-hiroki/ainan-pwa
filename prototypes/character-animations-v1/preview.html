<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AINAN character animation prototype</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <main class="app">
    <section class="stage-shell" aria-label="animation preview">
      <div id="stage" class="stage">
        <img class="scene-layer" src="../cast-layer-set-v2/assets/sky-390x844.png" alt="">
        <img class="scene-layer" src="../cast-layer-set-v2/assets/clouds-390x844.png" alt="">
        <img class="scene-layer" src="../cast-layer-set-v2/assets/distantHarbor-390x844.png" alt="">
        <img class="scene-layer" src="../cast-layer-set-v2/assets/sea-390x844.png" alt="">
        <img class="scene-layer" src="../cast-layer-set-v2/assets/platform-390x844.png" alt="">
        <div id="actor" class="actor" data-pose="idle">
          <img id="poseA" class="pose pose-a" src="assets/idle.png" alt="釣り人のアニメーション">
          <img id="poseB" class="pose pose-b" src="assets/idle.png" alt="">
          <svg id="rod" class="rod-layer" viewBox="0 0 320 420" aria-hidden="true">
            <defs><linearGradient id="rodPaint" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#201913"/><stop offset=".72" stop-color="#504033"/><stop offset="1" stop-color="#e2703e"/></linearGradient></defs>
            <path id="rodShaft" d="M214 193 L261 58" />
            <path id="fishingLine" d="M261 58 Q315 135 305 290" />
            <circle id="gripMarker" cx="214" cy="193" r="3" />
          </svg>
          <img id="fish" class="fish-layer" src="../../fishing-game/assets/generated/hero/fish_hero_tai.svg" alt="釣れた魚">
        </div>
        <div class="safe-label"><span id="stateLabel">待機</span><span id="phaseLabel">idle</span></div>
      </div>
    </section>
    <section class="panel">
      <p class="eyebrow">PLAYABLE MOTION STUDY · v1</p>
      <h1>同一キャラクター 4状態</h1>
      <div class="state-grid" role="radiogroup" aria-label="状態">
        <button class="state-button active" data-state="cast" aria-pressed="true">振りかぶり → キャスト<small>one-shot</small></button>
        <button class="state-button" data-state="fight" aria-pressed="false">魚の引きに抵抗<small>loop</small></button>
        <button class="state-button" data-state="joy" aria-pressed="false">釣果を掲げて喜ぶ<small>one-shot</small></button>
        <button class="state-button" data-state="sad" aria-pressed="false">魚が逃げて落胆<small>one-shot</small></button>
      </div>
      <div class="transport">
        <button id="play">再生</button><button id="pause">一時停止</button><button id="restart">最初から</button>
      </div>
      <div class="options">
        <label><input id="loop" type="checkbox"> one-shotもループ</label>
        <label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label>
      </div>
      <dl class="status"><div><dt>状態</dt><dd id="statusState">cast</dd></div><div><dt>実行</dt><dd id="statusRun">停止</dd></div><div><dt>二重再生</dt><dd id="statusGuard">guard ready</dd></div></dl>
      <p class="note">キャラクター・ロッド・釣果魚は別レイヤー。足元ピボットは全フレーム共通 (160, 400)。</p>
    </section>
  </main>
  <script type="module" src="animation-player.js"></script>
</body>
</html>
