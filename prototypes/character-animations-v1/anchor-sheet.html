<!doctype html><html><head><meta charset="utf-8"><title>Pose and anchor comparison</title><style>
*{box-sizing:border-box}body{margin:0;padding:30px;background:#092033;color:#eef9ff;font:15px Inter,system-ui}h1{margin:0 0 4px;font-size:28px}p{margin:0 0 22px;color:#9bc8dc}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card{background:#0e3048;border:1px solid #56809a;border-radius:16px;padding:12px}.frame{position:relative;aspect-ratio:320/420;background:repeating-conic-gradient(#eff7fa 0 25%,#cfdae0 0 50%) 50%/24px 24px;border-radius:10px;overflow:hidden}.frame img,.frame svg{position:absolute;inset:0;width:100%;height:100%}.name{font-weight:800;margin:9px 0 2px}.meta{font-size:12px;color:#9bc8dc}.legend{display:flex;gap:20px;margin-top:20px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.orange{background:#ff9e45}.cyan{background:#34d7ff}.green{background:#63e483}
</style></head><body><h1>AINAN pose / anchor comparison</h1><p>Approved v2 identity → preparation → main pose. All frames 320×420; green cross = shared foot/seat pivot (160,400).</p><div id="grid" class="grid"></div><div class="legend"><span><i class="dot orange"></i>hand/grip</span><span><i class="dot cyan"></i>rod tip</span><span><i class="dot green"></i>shared pivot</span></div><script type="module">
const manifest=await fetch('./animation-manifest.json').then(r=>r.json());
const cards=[['approved idle','idle'],['cast prep','cast-windup'],['cast main','cast-release'],['fight A','fight-left'],['fight B','fight-right'],['joy prep','joy-lift'],['joy main','joy-hold'],['sad prep','sad-drop'],['sad main','sad-slump']];
const grid=document.querySelector('#grid');
for(const [label,key] of cards){const p=manifest.poses[key];const g=p.grip||p.fishAnchor;const t=p.rodTip;const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="frame"><img src="${p.file}"><svg viewBox="0 0 320 420"><path d="M150 400h20M160 390v20" stroke="#35e682" stroke-width="3"/>${g?`<circle cx="${g[0]}" cy="${g[1]}" r="7" fill="#ff9e45"/>`:''}${t?`<circle cx="${t[0]}" cy="${t[1]}" r="6" fill="#34d7ff"/><path d="M${g[0]} ${g[1]}L${t[0]} ${t[1]}" stroke="#34d7ff" stroke-width="2" stroke-dasharray="5 4"/>`:''}</svg></div><div class="name">${label}</div><div class="meta">${key}${g?` · anchor ${g.join(',')}`:''}</div>`;grid.append(card)}
</script></body></html>
