<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffe0a0" />
    <title>&#x753a;&#x304a;&#x3053;&#x3057;&#x91e3;&#x308a;&#x30b2;&#x30fc;&#x30e0;&#xff08;&#x4eee;&#xff09;</title>
    <link rel="apple-touch-icon" href="/ainan-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --game-ratio: 390 / 844;
        --game-ratio-number: 0.4620853081;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #ffe0a0;
        font-family: Nunito, 'M PLUS Rounded 1c', system-ui, sans-serif;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      body {
        min-height: 100dvh;
      }

      #game-container {
        box-sizing: border-box;
        width: 100vw;
        height: 100dvh;
        padding:
          var(--safe-top)
          var(--safe-right)
          var(--safe-bottom)
          var(--safe-left);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /*
       * Phaser owns the internal 390x844 logical canvas. Browser scaling is
       * width-driven, capped by the visible mobile height. That makes the full
       * portrait frame fill the phone as much as possible without ever cropping
       * or stretching it.
       */
      #game-container canvas {
        display: block;
        width: min(
          100%,
          calc((100dvh - var(--safe-top) - var(--safe-bottom)) * var(--game-ratio-number))
        ) !important;
        height: auto !important;
        max-height: 100% !important;
        aspect-ratio: var(--game-ratio);
        touch-action: none;
      }

      @supports not (height: 100dvh) {
        body,
        #game-container {
          height: 100vh;
        }

        #game-container canvas {
          width: min(
            100%,
            calc((100vh - var(--safe-top) - var(--safe-bottom)) * var(--game-ratio-number))
          ) !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script>
      if ('serviceWorker' in navigator) {
        let refreshing = false
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return
          refreshing = true
          location.reload()
        })
      }
    </script>
    <!-- WebFont Loader keeps the first Phaser text render crisp and stable. -->
    <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js"></script>
    <script type="module" src="/fishing-game/js/main.js"></script>
  </body>
</html>
