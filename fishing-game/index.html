<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>町おこし釣りゲーム（仮）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #ffe0a0;
        font-family: Nunito, 'M PLUS Rounded 1c', system-ui, sans-serif;
      }
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-container canvas {
        width: min(100vw, 390px) !important;
        height: min(100vh, 844px) !important;
        max-width: calc(100vh * 390 / 844);
        max-height: calc(100vw * 844 / 390);
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <!-- WebFont Loader keeps the first Phaser text render crisp and stable. -->
    <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js"></script>
    <script type="module" src="/fishing-game/js/main.js"></script>
  </body>
</html>
